# ld65 : bloc 1 de The Hobbit ($0400-$04FF) en un seul segment.
# Le listing disasm/block1.asm (généré par da65) ne déclare aucun segment :
# tout part dans le segment par défaut, calé à l'adresse de chargement.
MEMORY {
    B1: start = $0400, size = $0100, file = %O, fill = yes, fillval = $00;
}
SEGMENTS {
    CODE: load = B1, type = ro;
}
