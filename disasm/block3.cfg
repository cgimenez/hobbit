# ld65 : bloc 3 de The Hobbit ($7AC0-$91B1) en un seul segment.
# Le listing disasm/block3.asm (généré par da65) ne déclare aucun segment :
# tout part dans le segment par défaut, calé à l'adresse de chargement.
MEMORY {
    B3: start = $7AC0, size = $16F2, file = %O, fill = yes, fillval = $00;
}
SEGMENTS {
    CODE: load = B3, type = ro;
}
