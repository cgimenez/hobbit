# ld65 : bloc 2 de The Hobbit ($0500-$2BBD) en un seul segment.
# Le listing disasm/block2.asm (généré par da65) ne déclare aucun segment :
# tout part dans le segment par défaut, calé à l'adresse de chargement.
MEMORY {
    B2: start = $0500, size = $26BE, file = %O, fill = yes, fillval = $00;
}
SEGMENTS {
    CODE: load = B2, type = ro;
}
