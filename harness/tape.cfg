# ld65 : stubs cassette B1 cales a $F700 (zone "ROM" : RAM sous sim65,
# ROM sur Oric reel -> le jeu n'y ecrit jamais ; cf. harness/tape.s).
# TAPECODE $F700-$FBFF, buffer cassette $E800-$EFFF (sim_pack.py).
MEMORY {
    TAPE: start = $F700, size = $0500, file = %O, fill = yes, fillval = $00;
}
SEGMENTS {
    CODE: load = TAPE, type = ro;
}
