# ld65 : shims snapshots SAVE/LOAD cales a $F700 (remplacent tape.s
# dans les images --snapshot ; cf. harness/snap.s).
# SNAPCODE $F700-$FBFF, blob snapshot $E800-$F62B (sim_pack.py).
MEMORY {
    SNAP: start = $F700, size = $0500, file = %O, fill = yes, fillval = $00;
}
SEGMENTS {
    CODE: load = SNAP, type = ro;
}
