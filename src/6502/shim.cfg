# ld65 : shims sim65 cales a $C000 (zone "ROM" : RAM sous sim65, ROM sur
# Oric reel -> le jeu n'y ecrit jamais ; lectures jeu limitees au charset
# $FC70-$FFBF charge depuis basic10.rom par scripts/sim_pack.py).
# CODE $C000-$C2EF, vars shim $C2F0-$C2FE, miroir texte $C300.
MEMORY {
    SHIM: start = $C000, size = $02F0, file = %O, fill = yes, fillval = $00;
}
SEGMENTS {
    CODE: load = SHIM, type = ro;
}
