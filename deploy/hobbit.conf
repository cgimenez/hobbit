# Hobbit (Oric, 1982) — conf nginx minimale, HTTP seul.
# Sert le build web (build/wasm). En-tetes COOP/COEP repris de dev/serve.js
# (requis par le runtime WASM).
server {
    listen 80;
    server_name hobbit.blobmachine.fr;

    root /home/debian/coding/hobbit/build/wasm;
    index index.html;

    types {
        text/html html htm;
        text/css css;
        application/javascript js mjs cjs;
        application/wasm wasm;
        application/json json;
        image/svg+xml svg;
    }

    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
