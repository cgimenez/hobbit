# ld65 : bloc 4 de The Hobbit ($2C00-$7A80) en un seul segment.
# Le listing disasm/block4.asm (généré par da65) ne déclare aucun segment :
# tout part dans le segment par défaut, calé à l'adresse de chargement.
MEMORY {
    B4: start = $2C00, size = $4E81, file = %O, fill = yes, fillval = $00;
}
SEGMENTS {
    CODE: load = B4, type = ro;
}
